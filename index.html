<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Zoe Haines</title>
    <meta name="viewport" content="width=device-width,initial-scale=1" />
    <meta name="description" content="" />

    <!-- Bootstrap Import -->
    <link
      href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
      rel="stylesheet"
      crossorigin="anonymous"
    />

    <link rel="stylesheet" type="text/css" href="css/style.css" />
    <link rel="icon" href="favicon.png" />
    <meta name="theme-color" content="#181822" />
  </head>
  <body class="d-flex flex-column min-vh-100">
    <!-- Loading Spinner -->
    <div
      id="loader-wrapper"
      class="position-fixed top-0 start-0 z-3 w-100 h-100 d-flex justify-content-center align-items-center"
      style="background-color: #181822"
    >
      <div class="spinner-border text-light" role="status">
        <span class="visually-hidden">Loading...</span>
      </div>
    </div>

    <!-- Content Container -->
    <main class="flex-grow-1">
      <!-- Title -->
      <div class="container pt-4">
        <h1 class="mb-1">Zoe Haines</h1>
        <h5 class="mb-1">Bristol, United Kingdom</h5>
      </div>

      <!-- Grid -->
      <div class="container">
        <!-- Row 1, Social media links on left & "About Me" on right -->
        <div class="row">
          <!-- R1 Left Column -->
          <div class="col">
            <!-- Email Link -->
            <div class="row">
              <div class="col">
                <a
                  href="mailto:contact@zoehaines.co.uk"
                  class="d-inline-block"
                  target="_blank"
                >
                  <h6 class="mb-1">Contact@zoehaines.co.uk</h6>
                </a>
              </div>
            </div>

            <!-- LinkedIn Link -->
            <div class="row">
              <div class="col">
                <a
                  href="https://linkedin.com/in/zoe-haines"
                  class="d-inline-block"
                  target="_blank"
                >
                  <h6 class="mb-1">LinkedIn</h6>
                </a>
              </div>
            </div>

            <!-- Email Link -->
            <div class="row">
              <div class="col">
                <a
                  href="https://github.com/goetic-zoe/"
                  class="d-inline-block"
                  target="_blank"
                >
                  <h6 class="mb-1">GitHub</h6>
                </a>
              </div>
            </div>
          </div>

          <!-- R1 Right Column -->
          <div class="col">
            <p>Right</p>
          </div>
        </div>
      </div>
    </main>

    <!-- Footer -->
    <footer class="py-3 text-center text-secondary">
      <div class="container">
        <small
          >© <span id="year"></span> Zoe Haines. All Rights Reserved.</small
        >
      </div>
    </footer>

    <!-- Scripts -->
    <script
      src="https://code.jquery.com/jquery-4.0.0.min.js"
      crossorigin="anonymous"
    ></script>
    <script
      src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/js/bootstrap.bundle.min.js"
      crossorigin="anonymous"
    ></script>

    <!-- Get Year -->
    <script type="text/javascript">
      $("#year").text(new Date().getFullYear());
    </script>

    <!-- Loader -->
    <script type="text/javascript">
      $(window).on("load", function () {
        $("#loader-wrapper").fadeOut(700, function () {
          $(this).removeClass("d-flex").addClass("d-none");
        });
      });
    </script>
    <script src="js/app.js"></script>
  </body>
</html>
